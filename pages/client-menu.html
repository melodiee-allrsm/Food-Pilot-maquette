<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client — Food Pilot</title>
  <meta name="description" content="Decouvrez notre menu — gastronomie sénégalaise d'exception.">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="../assets/js/tailwind-config.js" defer></script>
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    body { padding-bottom: 80px; }
    .dish-card { transition: transform 0.2s, box-shadow 0.2s; }
    .dish-card:hover { transform: translateY(-3px); }
    .category-pill { transition: all 0.2s; }
    .category-pill.active { background: var(--color-primary); color: white; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; backdrop-filter: blur(4px); }
    .modal-overlay.active { display: flex; align-items: center; justify-content: center; }
    .modal-content { background: white; border-radius: 24px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; transform: translateY(20px); transition: transform 0.3s; padding: 24px; }
    .modal-overlay.active .modal-content { transform: translateY(0); }
  </style>
</head>
<body class="font-body-md text-on-surface bg-background" data-page="client">

  <!-- Topbar -->
  <header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-stone-200/60 shadow-sm">
    <div class="flex items-center justify-between px-5 h-16 max-w-2xl mx-auto">
      <div class="flex items-center gap-3">
        <span class="font-h3 text-primary italic text-lg">Food Pilot</span>
      </div>
      <div class="flex items-center gap-3">
        <button class="relative p-2 text-stone-600 hover:bg-stone-100 rounded-full transition-colors" onclick="ClientApp.openCart()">
          <span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1">shopping_bag</span>
          <span id="cart-badge" style="display:none" class="absolute -top-1 -right-1 w-5 h-5 bg-primary text-white text-[10px] font-bold rounded-full flex items-center justify-center">0</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-4 py-6">

    <!-- TAB: MENU -->
    <div id="tab-menu" class="tab-content active">
      <!-- Bannière promo -->
      <div class="bg-primary/5 border border-primary/10 rounded-xl px-5 py-3 flex items-center gap-3 mb-6">
        <span class="material-symbols-outlined text-primary text-xl">local_offer</span>
        <p class="text-sm text-primary font-semibold">Livraison gratuite aujourd'hui à partir de 10 000 FCFA</p>
      </div>

      <!-- Filtres categories -->
      <div class="flex gap-2 py-3 overflow-x-auto no-scrollbar mb-4" id="menu-categories">
        <button class="category-pill active flex-shrink-0 px-4 py-1.5 rounded-full text-sm font-semibold" data-cat="all">Tout</button>
        <button class="category-pill flex-shrink-0 px-4 py-1.5 rounded-full text-sm font-semibold bg-stone-100 text-stone-600" data-cat="Plats">Plats</button>
        <button class="category-pill flex-shrink-0 px-4 py-1.5 rounded-full text-sm font-semibold bg-stone-100 text-stone-600" data-cat="Entrées">Entrées</button>
        <button class="category-pill flex-shrink-0 px-4 py-1.5 rounded-full text-sm font-semibold bg-stone-100 text-stone-600" data-cat="Desserts">Desserts</button>
        <button class="category-pill flex-shrink-0 px-4 py-1.5 rounded-full text-sm font-semibold bg-stone-100 text-stone-600" data-cat="Boissons">Boissons</button>
      </div>

      <div id="client-menu-container" class="space-y-4">
        <!-- Les plats seront injectés ici par render.js -->
      </div>
    </div>

    <!-- TAB: RESERVATION -->
    <div id="tab-resa" class="tab-content">
      <h2 class="font-h2 text-2xl text-stone-900 mb-6">Réserver une table</h2>
      <form id="resa-form" class="space-y-4 bg-white p-6 rounded-2xl border border-stone-100 shadow-sm">
        <div>
          <label class="block text-sm font-medium text-stone-700 mb-1">Nom complet</label>
          <input type="text" id="resa-name" required class="w-full border-stone-200 rounded-xl px-4 py-3 focus:ring-primary focus:border-primary" placeholder="Ex: Aïssatou Diallo">
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-stone-700 mb-1">Date</label>
            <input type="date" id="resa-date" required class="w-full border-stone-200 rounded-xl px-4 py-3 focus:ring-primary focus:border-primary">
          </div>
          <div>
            <label class="block text-sm font-medium text-stone-700 mb-1">Heure</label>
            <input type="time" id="resa-time" required class="w-full border-stone-200 rounded-xl px-4 py-3 focus:ring-primary focus:border-primary">
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-stone-700 mb-1">Nombre de personnes</label>
          <input type="number" id="resa-pax" min="1" max="20" required class="w-full border-stone-200 rounded-xl px-4 py-3 focus:ring-primary focus:border-primary" value="2">
        </div>
        <button type="submit" class="w-full btn btn--primary py-3 mt-2">Confirmer la réservation</button>
      </form>

      <h3 class="font-bold text-stone-800 mt-8 mb-4">Vos réservations</h3>
      <div id="client-resa-list" class="space-y-3">
        <!-- Injecté par render.js -->
      </div>
    </div>

    <!-- TAB: COMMANDES (SUIVI) -->
    <div id="tab-orders" class="tab-content">
      <h2 class="font-h2 text-2xl text-stone-900 mb-6">Suivi de commandes</h2>
      <div id="client-orders-list" class="space-y-4">
        <!-- Injecté par render.js -->
      </div>
    </div>

  </main>

  <!-- PANIER MODAL -->
  <div id="cart-modal" class="modal-overlay">
    <div class="modal-content relative flex flex-col h-full max-h-[85vh]">
      <button onclick="ClientApp.closeCart()" class="absolute top-4 right-4 p-2 text-stone-400 hover:text-stone-800 rounded-full bg-stone-100">
        <span class="material-symbols-outlined">close</span>
      </button>
      <h2 class="font-h2 text-xl mb-4">Votre Panier</h2>
      
      <div id="cart-items" class="flex-1 overflow-y-auto space-y-4 pr-2">
        <!-- Injecté par JS -->
      </div>
      
      <div class="mt-6 pt-4 border-t border-stone-100">
        <div class="flex justify-between font-bold text-lg mb-4 text-stone-900">
          <span>Total:</span>
          <span id="cart-total-price">0 FCFA</span>
        </div>
        <button id="btn-checkout" onclick="ClientApp.openPayment()" class="w-full btn btn--primary py-3">Passer la commande</button>
      </div>
    </div>
  </div>

  <!-- PAIEMENT MODAL -->
  <div id="payment-modal" class="modal-overlay">
    <div class="modal-content relative">
      <button onclick="ClientApp.closePayment()" class="absolute top-4 right-4 p-2 text-stone-400 hover:text-stone-800 rounded-full bg-stone-100">
        <span class="material-symbols-outlined">close</span>
      </button>
      <h2 class="font-h2 text-xl mb-4">Paiement</h2>
      <p class="text-sm text-stone-500 mb-6">Choisissez votre méthode de paiement (Simulation).</p>
      
      <div class="space-y-3">
        <button onclick="ClientApp.processPayment('Wave')" class="w-full flex items-center gap-4 p-4 border border-stone-200 rounded-xl hover:border-blue-500 hover:bg-blue-50 transition-colors text-left">
          <div class="w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center text-blue-600 font-bold text-xl">W</div>
          <div>
            <div class="font-bold text-stone-800">Wave</div>
            <div class="text-xs text-stone-500">Paiement mobile instantané</div>
          </div>
        </button>
        
        <button onclick="ClientApp.processPayment('Orange Money')" class="w-full flex items-center gap-4 p-4 border border-stone-200 rounded-xl hover:border-orange-500 hover:bg-orange-50 transition-colors text-left">
          <div class="w-12 h-12 bg-orange-100 rounded-lg flex items-center justify-center text-orange-600 font-bold text-xl">OM</div>
          <div>
            <div class="font-bold text-stone-800">Orange Money</div>
            <div class="text-xs text-stone-500">Paiement mobile</div>
          </div>
        </button>
        
        <button onclick="ClientApp.processPayment('Espèces')" class="w-full flex items-center gap-4 p-4 border border-stone-200 rounded-xl hover:border-green-500 hover:bg-green-50 transition-colors text-left">
          <div class="w-12 h-12 bg-green-100 rounded-lg flex items-center justify-center text-green-600">
            <span class="material-symbols-outlined">payments</span>
          </div>
          <div>
            <div class="font-bold text-stone-800">Espèces</div>
            <div class="text-xs text-stone-500">Paiement à la livraison / sur place</div>
          </div>
        </button>
      </div>
    </div>
  </div>

  <!-- FACTURE MODAL -->
  <div id="invoice-modal" class="modal-overlay">
    <div class="modal-content relative bg-stone-50">
      <button onclick="document.getElementById('invoice-modal').classList.remove('active')" class="absolute top-4 right-4 p-2 text-stone-400 hover:text-stone-800 rounded-full bg-stone-200">
        <span class="material-symbols-outlined">close</span>
      </button>
      <div id="invoice-details" class="bg-white p-6 rounded-xl border border-stone-200 shadow-sm mt-4">
        <!-- Injecté par JS -->
      </div>
    </div>
  </div>

  <!-- Barre de navigation bas -->
  <nav class="client-bottom-nav">
    <a href="#" class="nav-btn active" data-target="tab-menu">
      <span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1">menu_book</span>
      Menu
    </a>
    <a href="#" class="nav-btn" data-target="tab-resa">
      <span class="material-symbols-outlined">event_seat</span>
      Réservation
    </a>
    <a href="#" class="nav-btn" data-target="tab-orders">
      <span class="material-symbols-outlined">receipt_long</span>
      Commandes
    </a>
  </nav>

  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/render.js"></script>
  <script src="../assets/js/app.js"></script>
</body>
</html>
