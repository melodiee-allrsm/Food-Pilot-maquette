<body class="font-body-md text-on-surface">
<!-- Main Content Canvas -->
<main class="relative min-h-screen flex flex-col max-w-md mx-auto overflow-hidden">
<!-- Top Section: Map Illustration -->
<section class="relative h-[397px] w-full overflow-hidden">
<div class="absolute inset-0 map-bg grayscale opacity-40 mix-blend-multiply" data-alt="Minimalist architectural map illustration with clean route lines on a warm beige parchment texture background">
</div>
<!-- Branding Overlay -->
<div class="absolute top-12 left-0 w-full flex flex-col items-center px-6">
<span class="font-h2 text-h2 text-primary italic mb-2">Le Baobab d'Or</span>
<div class="h-px w-12 bg-primary/30"></div>
</div>
<!-- Route Line Decoration -->
<svg class="absolute inset-0 w-full h-full pointer-events-none" viewbox="0 0 400 400">
<path d="M-20 300 Q100 280 180 320 T400 290" fill="none" opacity="0.4" stroke="#8d4b00" stroke-dasharray="8 4" stroke-width="1.5"></path>
<path d="M50 0 Q80 150 200 180 T450 350" fill="none" opacity="0.2" stroke="#8d4b00" stroke-dasharray="8 4" stroke-width="1.5"></path>
</svg>
</section>
<!-- Bottom Card: Authentication -->
<section class="relative -mt-10 flex-grow bg-surface rounded-t-[32px] shadow-[0_-8px_40px_rgba(28,25,23,0.08)] px-8 pt-10 pb-12 z-10 border-t border-stone-200/50">
<!-- Header & Status -->
<div class="flex justify-between items-start mb-8">
<div>
<h1 class="font-h3 text-h3 text-on-background mb-1">Espace Livreur</h1>
<p class="text-on-surface-variant font-body-md opacity-70">Heureux de vous revoir</p>
</div>
<!-- Pre-activated Green Pill -->
<div class="flex items-center gap-2 bg-emerald-50 text-emerald-700 px-4 py-1.5 rounded-full border border-emerald-100">
<span class="flex h-2 w-2 rounded-full bg-emerald-500"></span>
<span class="font-label-caps text-label-caps uppercase tracking-widest">Je suis disponible</span>
</div>
</div>
<form class="flex flex-col gap-8">
<!-- Phone Field -->
<div class="group">
<label class="font-label-caps text-label-caps text-on-surface-variant mb-2 block opacity-60">Numéro de téléphone</label>
<div class="flex items-center gap-3 border-b border-stone-300 focus-within:border-primary transition-colors py-3">
<span class="material-symbols-outlined text-outline-variant">phone_android</span>
<span class="text-on-surface font-body-md font-medium">+221</span>
<input class="flex-grow bg-transparent border-none focus:ring-0 text-on-surface font-body-md placeholder:text-outline-variant/50" placeholder="77 000 00 00" type="tel"/>
</div>
</div>
<!-- OTP Section -->
<div>
<label class="font-label-caps text-label-caps text-on-surface-variant mb-4 block opacity-60">Code de vérification (4 chiffres)</label>
<div class="flex justify-between gap-4">
<input class="otp-input w-16 h-16 bg-surface-container-low rounded-xl text-center text-h3 font-h3 text-primary border-transparent focus:border-primary focus:bg-white transition-all shadow-sm" maxlength="1" type="text" value="2"/>
<input class="otp-input w-16 h-16 bg-surface-container-low rounded-xl text-center text-h3 font-h3 text-primary border-transparent focus:border-primary focus:bg-white transition-all shadow-sm" maxlength="1" type="text" value="0"/>
<input class="otp-input w-16 h-16 bg-surface-container-low rounded-xl text-center text-h3 font-h3 text-primary border-transparent focus:border-primary focus:bg-white transition-all shadow-sm" maxlength="1" type="text"/>
<input class="otp-input w-16 h-16 bg-surface-container-low rounded-xl text-center text-h3 font-h3 text-primary border-transparent focus:border-primary focus:bg-white transition-all shadow-sm" maxlength="1" type="text"/>
</div>
<button class="mt-4 text-label-caps font-label-caps text-primary underline underline-offset-4 opacity-80" type="button">Renvoyer le code</button>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-white font-button text-button py-5 rounded-full shadow-lg shadow-primary/20 hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-3 mt-4" type="submit">
                    Valider et commencer
                    <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>

<p class="text-center mt-10 text-on-surface-variant opacity-50 font-label-caps text-label-caps px-4">
                En vous connectant, vous acceptez les conditions de service de la logistique Le Baobab d'Or.
            </p>
